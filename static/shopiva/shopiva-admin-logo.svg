<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title>Shopiva Admin — Kenya LTD</title>
<desc>Modern Shopiva Admin Control Center logo</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#071d2b"/><stop offset=".55" stop-color="#083b43"/><stop offset="1" stop-color="#087a68"/>
  </linearGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#48f0a0"/><stop offset=".55" stop-color="#13bd72"/><stop offset="1" stop-color="#087f55"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffe98a"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#d98b0b"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
  </filter>
</defs>

<!-- Premium horizontal lockup -->
<rect x="8" y="8" width="1184" height="344" rx="64" fill="url(#bg)" stroke="#3ce79b" stroke-width="4"/>

<!-- Standalone Admin mark -->
<rect x="42" y="42" width="276" height="276" rx="58" fill="#061a25" stroke="#35df93" stroke-width="4" filter="url(#shadow)"/>
<path d="M180 79 L259 111 L259 180 C259 235 225 274 180 291 C135 274 101 235 101 180 L101 111 Z"
      fill="url(#mark)" opacity=".98"/>
<path d="M143 148 C151 126 177 119 198 129 C213 136 218 151 212 164 C207 175 195 180 178 185 L163 190 C151 194 149 202 155 208 C162 216 179 217 191 210"
      fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M151 235 L173 256 L217 205" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="246" cy="101" r="17" fill="url(#gold)"/>
<circle cx="246" cy="101" r="7" fill="#fff5bd"/>

<!-- Wordmark -->
<text x="365" y="177" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" letter-spacing="-5" fill="#ffffff">Shop<tspan fill="#4af0a2">iva</tspan></text>
<rect x="370" y="199" width="150" height="5" rx="2.5" fill="url(#gold)"/>
<text x="365" y="250" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" letter-spacing="7" fill="#d8f7ee">ADMIN CONTROL CENTER</text>
<text x="367" y="291" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#9ed7cd">KENYA LTD  ·  SECURE OPERATIONS</text>
</svg>