{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<link rel="manifest" href="{% url 'delivery_manifest' %}">
<title>Shopiva Delivery | Rider Login</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071b14}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.viewport{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}
.artboard{position:absolute;inset:0;width:100vw;height:100vh;line-height:0}
.artboard>picture{position:absolute;inset:0;width:100%;height:100%;display:block}
.artboard>picture>img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.overlay{position:absolute;inset:0;z-index:2}
.login-form{position:absolute;inset:0;margin:0}
.login-form input{
  position:absolute;
  border:0!important;
  outline:0;
  background:transparent!important;
  color:transparent!important;
  caret-color:#087f5b;
  font-size:clamp(12px,1.25vw,18px);
  font-family:inherit;
  font-weight:600;
  padding:0 4%;
  line-height:1.2;
  box-shadow:none!important;
  -webkit-appearance:none;
  appearance:none;
  border-radius:14px
}
.login-form input::placeholder{color:transparent!important;opacity:0}
.login-form input:focus,
.login-form input.has-value{
  color:#526171!important;
  background:rgba(255,255,255,.94)!important;
  box-shadow:inset 0 0 0 2px rgba(16,185,105,.45),0 2px 8px rgba(0,0,0,.04)!important
}
.login-form input[name="username"]{left:33.2%;top:39.65%;width:32.5%;height:5.7%}
.login-form input[name="password"]{left:33.2%;top:46.75%;width:32.5%;height:5.7%}
.login-submit{
  position:absolute;
  left:33.2%;
  top:57.55%;
  width:32.5%;
  height:6.15%;
  border:0;
  background:transparent;
  border-radius:16px;
  cursor:pointer;
  color:transparent;
  font-size:1px;
  padding:0
}
.login-submit:focus{outline:3px solid rgba(34,225,128,.85);outline-offset:2px}
.remember-hit,.forgot-hit,.signup-hit,.phone-hit{position:absolute;display:block}
.remember-hit{left:32.9%;top:53.35%;width:3%;height:3.5%;cursor:pointer}
.remember-hit input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}
.forgot-hit{left:54.5%;top:53.25%;width:11%;height:3.7%}
.signup-hit{left:48.5%;top:64.6%;width:16%;height:3.5%}
.phone-hit{left:33.2%;top:76.15%;width:32.5%;height:5.8%}
.error-box{position:absolute;left:33%;top:30%;width:34%;padding:10px 14px;background:#fff0f0;border:1px solid #e6aaaa;border-radius:12px;color:#8e2929;font-size:13px;line-height:1.35;z-index:5}
@media(max-width:700px){
  .artboard>picture>img{width:auto;height:100%;left:50%;right:auto;inset-block:0;transform:translateX(-50%);object-fit:contain}
  .login-form input[name="username"]{left:11.7%;top:63.05%;width:76.6%;height:4.1%;font-size:16px}
  .login-form input[name="password"]{left:11.7%;top:68.05%;width:76.6%;height:4.1%;font-size:16px}
  .login-submit{left:11.7%;top:75.15%;width:76.6%;height:4.2%;border-radius:18px}
  .remember-hit{left:11.2%;top:72.2%;width:4.8%;height:3.2%}
  .forgot-hit{left:70%;top:72.15%;width:19%;height:3.4%}
  .signup-hit{left:48%;top:81.15%;width:31%;height:3.1%}
  .phone-hit{left:11.7%;top:85.0%;width:76.6%;height:4.4%}
  .error-box{left:9%;top:58%;width:82%;font-size:12px}
}
</style>
</head>
<body>
<div class="viewport">
  <main class="artboard" aria-label="Shopiva Delivery rider login">
    <picture>
      <source media="(max-width:700px)" srcset="https://shopiva-delivery-assets.floot.app/_cdn/static/75e90582-243f-4103-9ba1-19a0c0b5362d-shopiva-delivery-rider-login-mobile-9x16.png">
      <img src="https://shopiva-delivery-assets.floot.app/_cdn/static/9ce398e3-6f57-4ac1-9c28-d1391d225958-shopiva-delivery-rider-login-final.png" alt="Shopiva Delivery secure rider login">
    </picture>
    <div class="overlay">
      {% if form.non_field_errors %}<div class="error-box">{{ form.non_field_errors }}</div>{% endif %}
      <form class="login-form" method="post" autocomplete="off" novalidate>
        {% csrf_token %}{{ form.username }}{{ form.password }}
        <button class="login-submit" type="submit" aria-label="Sign in to Delivery">Sign in to Delivery</button>
      </form>
      <label class="remember-hit" aria-label="Remember me"><input type="checkbox" name="remember_me"></label>
      <a class="forgot-hit" href="#" aria-label="Forgot password"></a>
      <a class="signup-hit" href="{% url 'delivery_signup' %}" aria-label="Create an account"></a>
      <a class="phone-hit" href="tel:+254700000000" aria-label="Sign in with phone number"></a>
    </div>
  </main>
</div>
<script>
(function(){
  const f=document.querySelector('.login-form');
  if(!f)return;
  f.querySelectorAll('input[name="username"],input[name="password"]').forEach(el=>{
    el.setAttribute('autocomplete','off');
    el.setAttribute('autocapitalize','none');
    el.setAttribute('spellcheck','false');
    el.setAttribute('readonly','readonly');
    const sync=()=>el.classList.toggle('has-value',!!el.value);
    el.addEventListener('focus',()=>el.removeAttribute('readonly'),{once:true});
    el.addEventListener('input',sync);
    sync();
  });
})();
</script>
</body>
</html>
