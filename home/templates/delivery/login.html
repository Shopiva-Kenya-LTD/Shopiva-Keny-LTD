{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<link rel="manifest" href="{% url 'delivery_manifest' %}">
<title>Shopiva Delivery | Rider Login</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071b14}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mockup-stage{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}
.mockup-stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;user-select:none;-webkit-user-drag:none}
.overlay{position:absolute;inset:0}
.login-form{position:absolute;left:32.45%;top:39.65%;width:33.15%;height:24.1%}
.login-form input{position:absolute;left:8.1%;width:91.5%;height:19%;border:0!important;outline:0;background:transparent!important;color:#526171!important;font-size:clamp(12px,1.35vw,18px);font-family:inherit;font-weight:500;padding:0 4.2%;line-height:1.2;box-shadow:none!important;-webkit-appearance:none;appearance:none}
.login-form input::placeholder{color:#68798a;opacity:1}
.login-form input:focus{box-shadow:inset 0 0 0 2px rgba(16,185,105,.32)!important;border-radius:14px;background:rgba(255,255,255,.06)!important}
.login-form input:-webkit-autofill,.login-form input:-webkit-autofill:hover,.login-form input:-webkit-autofill:focus{-webkit-text-fill-color:#526171!important;caret-color:#526171!important;-webkit-box-shadow:0 0 0 1000px transparent inset!important;box-shadow:0 0 0 1000px transparent inset!important;transition:background-color 99999s ease-in-out 0s}
.login-form input[name="username"]{top:1%}.login-form input[name="password"]{top:25.5%}
.login-submit{position:absolute;left:8.1%;top:63%;width:91.5%;height:22%;border:0;background:transparent;border-radius:15px;cursor:pointer;color:transparent;font-size:1px;padding:0}
.login-submit:focus{outline:3px solid rgba(34,225,128,.8);outline-offset:2px}
.remember-hit{position:absolute;left:32.45%;top:53.25%;width:3.2%;height:3.8%;cursor:pointer}.remember-hit input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}
.forgot-hit,.signup-hit,.phone-hit{position:absolute;display:block}.forgot-hit{left:54.5%;top:53.3%;width:11%;height:3.4%}.signup-hit{left:49.2%;top:64.9%;width:14%;height:3.2%}.phone-hit{left:32.45%;top:72.2%;width:33.15%;height:5.5%}
.error-box{position:absolute;left:33%;top:32%;width:34%;padding:10px 14px;background:#fff0f0;border:1px solid #e6aaaa;border-radius:12px;color:#8e2929;font-size:13px;line-height:1.35;z-index:5}
@media(max-width:700px){.mockup-stage>img{object-position:center center}.login-form input{font-size:13px}}
</style>
</head>
<body>
<main class="mockup-stage" aria-label="Shopiva Delivery rider login">
<img src="https://b310cd3a-839b-4dae-a552-bf2c3083fa90.sandbox.floot.app/_cdn/static/5004c625-3b72-4577-ac41-32407678edfe-shopiva-delivery-login.png" alt="Shopiva Delivery secure rider login">
<div class="overlay">
{% if form.non_field_errors %}<div class="error-box">{{ form.non_field_errors }}</div>{% endif %}
<form class="login-form" method="post" autocomplete="on">{% csrf_token %}{{ form.username }}{{ form.password }}<button class="login-submit" type="submit" aria-label="Sign in to Delivery">Sign in to Delivery</button></form>
<label class="remember-hit" aria-label="Remember me"><input type="checkbox" name="remember_me"></label>
<a class="forgot-hit" href="#" aria-label="Forgot password"></a>
<a class="signup-hit" href="{% url 'delivery_signup' %}" aria-label="Create an account"></a>
<a class="phone-hit" href="tel:+254700000000" aria-label="Sign in with phone number"></a>
</div></main>
<script>history.scrollRestoration="manual";</script>
</body></html>
