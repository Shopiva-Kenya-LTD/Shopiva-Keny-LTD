{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f5b">
<meta name="description" content="Shopiva Delivery secure rider login">
<link rel="manifest" href="{% url 'delivery_manifest' %}">
<title>Shopiva Delivery | Rider Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0a2018;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
.mockup-stage{position:relative;width:100%;max-width:1374px;margin:0 auto;line-height:0}
.mockup-stage>img{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;z-index:2}
.hit{position:absolute;display:block}
.login-form{position:absolute;left:32.45%;top:39.65%;width:33.15%;height:24.1%}
.login-form input{position:absolute;left:8.1%;width:91.5%;height:19%;border:0;outline:0;background:transparent;color:#526171;font-size:clamp(12px,1.35vw,18px);padding:0 4.2%;line-height:1.2}
.login-form input::placeholder{color:#68798a;opacity:1}
.login-form input:focus{box-shadow:inset 0 0 0 2px rgba(16,185,105,.32);border-radius:14px;background:rgba(255,255,255,.06)}
.login-form input[name="username"]{top:1%}
.login-form input[name="password"]{top:25.5%}
.login-submit{position:absolute;left:8.1%;top:63%;width:91.5%;height:22%;border:0;background:transparent;border-radius:15px;cursor:pointer;color:transparent;font-size:1px}
.login-submit:focus{outline:3px solid rgba(34,225,128,.8);outline-offset:2px}
.remember-hit{left:32.45%;top:53.25%;width:3.2%;height:3.8%;cursor:pointer}
.remember-hit input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}
.forgot-hit{left:54.5%;top:53.3%;width:11%;height:3.4%}
.signup-hit{left:49.2%;top:64.9%;width:14%;height:3.2%}
.phone-hit{left:32.45%;top:72.2%;width:33.15%;height:5.5%}
.error-box{position:absolute;left:33%;top:32%;width:32%;padding:8px 12px;background:rgba(255,239,239,.96);border:1px solid #e6aaaa;border-radius:12px;color:#8e2929;font-size:13px;line-height:1.35;z-index:5}
@media(max-width:760px){
  .mockup-stage{width:100%;min-width:0}
  .mockup-stage>img{width:100%}
  .login-form input{font-size:12px}
  .error-box{font-size:10px}
}
@media(max-width:520px){
  .mockup-stage{min-width:760px;margin-left:50%;transform:translateX(-50%)}
  body{overflow-x:auto}
}
</style>
</head>
<body>
<main class="mockup-stage" aria-label="Shopiva Delivery rider login">
  <img src="{% static 'shopiva/delivery-login-mockup.jpg' %}" alt="Shopiva Delivery secure rider login">

  <div class="overlay">
    {% if form.non_field_errors %}
    <div class="error-box">{{ form.non_field_errors }}</div>
    {% endif %}

    <form class="login-form" method="post" autocomplete="on">
      {% csrf_token %}
      {{ form.username }}
      {{ form.password }}
      <button class="login-submit" type="submit" aria-label="Sign in to Delivery">Sign in to Delivery</button>
    </form>

    <label class="remember-hit" aria-label="Remember me">
      <input type="checkbox" name="remember_me">
    </label>

    <a class="hit forgot-hit" href="#" aria-label="Forgot password"></a>
    <a class="hit signup-hit" href="{% url 'delivery_signup' %}" aria-label="Create a delivery partner account"></a>
    <a class="hit phone-hit" href="tel:+254700000000" aria-label="Sign in with phone number"></a>
  </div>
</main>
</body>
</html>
