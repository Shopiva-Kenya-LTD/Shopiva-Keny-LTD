services:
  - type: web
    name: shopiva-keny-ltd
    runtime: python
    domains:
      - shopivakenya.top
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    renderSubdomainPolicy: disabled
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py check --deploy &&
      python manage.py check &&
      python manage.py migrate --noinput &&
      python manage.py migrate --check &&
      python manage.py system_preflight &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn shopiva.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "shopiva-keny-ltd.onrender.com,shopivakenya.top,www.shopivakenya.top"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://shopiva-keny-ltd.onrender.com,https://shopivakenya.top,https://www.shopivakenya.top"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: NIA_PHONE_CALLS_ENABLED
        value: "true"
      - key: NIA_SPEECH_LANGUAGE
        value: "en-KE"
      - key: NIA_TTS_LANGUAGE
        value: "en-GB"
      - key: NIA_SPEECH_TIMEOUT
        value: "10"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY
        sync: false
      - key: TWILIO_API_SECRET
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: NIA_ADMIN_PHONE
        sync: false
      - key: NIA_ADMIN_CALLER_PHONE
        sync: false
      - key: NIA_CRON_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: EMAIL_HOST
        value: "smtp.resend.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: "resend"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_TIMEOUT
        value: "20"
      - key: SMS_NOTIFICATIONS_ENABLED
        value: "true"
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      - key: WHATSAPP_NOTIFICATIONS_ENABLED
        value: "true"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: "v23.0"
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: "en_US"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_MAPS_MAP_ID
        sync: false
      - key: PUBLIC_SITE_URL
        value: "https://shopivakenya.top"
      - key: MPESA_ENV
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_TILL_NUMBER
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: PESALINK_ENABLED
        value: "false"
      - key: INTASEND_API_TOKEN
        sync: false
      - key: INTASEND_DEVICE_ID
        sync: false
      - key: INTASEND_PAYOUT_WALLET_ID
        sync: false
      - key: INTASEND_PAYOUT_CALLBACK_URL
        sync: false
