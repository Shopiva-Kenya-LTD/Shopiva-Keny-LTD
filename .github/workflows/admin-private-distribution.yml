name: Shopiva Private Admin Distribution

on:
  workflow_dispatch:
  push:
    paths:
      - "delivery-android/**"
      - ".github/workflows/admin-private-distribution.yml"
    branches: [main]

permissions:
  contents: read

jobs:
  admin_apk:
    name: Build private Admin APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build installable debug APK for private administration
        run: gradle -p delivery-android :app:assembleDebug
      - name: Publish private admin APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopiva-admin-private-apk
          path: delivery-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
