name: Shopiva Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install application dependencies
        run: pip install -r requirements.txt

      - name: Django deployment security checks
        env:
          SECRET_KEY: ci-only-long-random-placeholder-8f3d7a2c9b6e1f4a0d5c8b2e7f1a9d3c6e4b8a0f5d2c7e9
          DATABASE_URL: sqlite:///ci-security.sqlite3
          DEBUG: "false"
          ALLOWED_HOSTS: "testserver,localhost,127.0.0.1"
          CSRF_TRUSTED_ORIGINS: "https://testserver"
          SECURE_SSL_REDIRECT: "false"
        run: |
          python manage.py check --deploy
          python manage.py check
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py test

      - name: Python compile check
        run: python -m compileall -q .

      - name: Dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt
