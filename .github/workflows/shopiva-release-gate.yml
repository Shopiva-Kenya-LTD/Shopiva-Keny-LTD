name: Shopiva Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Django release checks
        env:
          DATABASE_URL: sqlite:///ci.sqlite3
          SECRET_KEY: ci-only-secret-key-9f2d8a7c4e1b6f3a0d5c9b2e7f4a1d8c6b3e0f5a2
          DEBUG: "false"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          CSRF_TRUSTED_ORIGINS: "https://example.invalid"
          SECURE_SSL_REDIRECT: "false"
        run: |
          python manage.py check --deploy
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check
          python manage.py system_preflight
          python manage.py collectstatic --noinput
          python manage.py test --verbosity 1
          python -m compileall -q home shopiva

  customer_android:
    name: Customer Android release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build customer Android debug, release and AAB
        run: gradle -p customer-android :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify customer Android release artifacts
        run: |
          test -s customer-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s customer-android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload customer Android store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopiva-customer-android-release-1.1.3
          path: |
            customer-android/app/build/outputs/bundle/release/app-release.aab
            customer-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  admin_android:
    name: Admin Android release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build admin Android internal release artifacts
        run: gradle -p delivery-android :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify admin Android internal artifact
        run: |
          test -s delivery-android/app/build/outputs/apk/debug/app-debug.apk
          test -s delivery-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s delivery-android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload admin Android internal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopiva-admin-android-internal
          path: |
            delivery-android/app/build/outputs/apk/debug/app-debug.apk
            delivery-android/app/build/outputs/apk/release/app-release-unsigned.apk
            delivery-android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  delivery_android:
    name: Delivery Android release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build delivery Android debug, release and AAB
        run: gradle -p delivery-driver-android :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify delivery Android release artifacts
        run: |
          test -s delivery-driver-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s delivery-driver-android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify delivery Android internal debug artifact
        run: test -s delivery-driver-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload delivery Android internal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shopiva-delivery-android-internal-1.0.3
          path: |
            delivery-driver-android/app/build/outputs/apk/debug/app-debug.apk
            delivery-driver-android/app/build/outputs/bundle/release/app-release.aab
            delivery-driver-android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  ios:
    name: Customer iOS release checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Validate customer iOS release metadata
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ios/ShopivaCustomer/Info.plist | grep -Fx "ke.co.shopiva.customer"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/ShopivaCustomer/Info.plist | grep -Fx "1.1.0"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/ShopivaCustomer/Info.plist | grep -Fx "2"
      - name: Build customer iOS release without distribution signing
        run: |
          xcodebuild \
            -project ios/ShopivaCustomer.xcodeproj \
            -scheme ShopivaCustomer \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  security:
    name: Security and dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q home shopiva support

  production_smoke:
    name: Production health smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check live Render health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused \
            --max-time 30 \
            https://shopivakenya.top/health/

  gate:
    name: Release gate summary
    if: ${{ always() }}
    needs: [backend, security, customer_android, admin_android, delivery_android, ios, production_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every release check passed
        env:
          BACKEND: ${{ needs.backend.result }}
          SECURITY: ${{ needs.security.result }}
          CUSTOMER_ANDROID: ${{ needs.customer_android.result }}
          ADMIN_ANDROID: ${{ needs.admin_android.result }}
          DELIVERY_ANDROID: ${{ needs.delivery_android.result }}
          IOS: ${{ needs.ios.result }}
          PRODUCTION_SMOKE: ${{ needs.production_smoke.result }}
        run: |
          echo "Backend: $BACKEND"
          echo "Security: $SECURITY"
          echo "Customer Android: $CUSTOMER_ANDROID"
          echo "Admin Android: $ADMIN_ANDROID"
          echo "Delivery Android: $DELIVERY_ANDROID"
          echo "iOS: $IOS"
          echo "Production smoke: $PRODUCTION_SMOKE"
          test "$BACKEND" = success
          test "$SECURITY" = success
          test "$CUSTOMER_ANDROID" = success
          test "$ADMIN_ANDROID" = success
          test "$DELIVERY_ANDROID" = success
          test "$IOS" = success
          test "$PRODUCTION_SMOKE" = success
