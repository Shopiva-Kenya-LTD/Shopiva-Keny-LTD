name: Shopiva Admin Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'delivery-android/**'
      - '.github/workflows/delivery-android-build.yml'
  pull_request:
    paths:
      - 'delivery-android/**'
      - '.github/workflows/delivery-android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Build debug Admin APK
        run: gradle -p delivery-android :app:assembleDebug

      - name: Build unsigned Admin release APK and AAB
        run: gradle -p delivery-android :app:assembleRelease :app:bundleRelease

      - name: Upload debug Admin APK
        uses: actions/upload-artifact@v7
        with:
          name: shopiva-admin-debug-apk
          path: delivery-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unsigned Admin release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: shopiva-admin-release-unsigned
          path: |
            delivery-android/app/build/outputs/apk/release/*.apk
            delivery-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  signed-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      SHOPIVA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 }}
      SHOPIVA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD }}
      SHOPIVA_ANDROID_KEY_ALIAS: ${{ secrets.SHOPIVA_ANDROID_KEY_ALIAS }}
      SHOPIVA_ANDROID_KEY_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check release signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "$SHOPIVA_ANDROID_KEYSTORE_BASE64" ] &&
             [ -n "$SHOPIVA_ANDROID_KEYSTORE_PASSWORD" ] &&
             [ -n "$SHOPIVA_ANDROID_KEY_ALIAS" ] &&
             [ -n "$SHOPIVA_ANDROID_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; unsigned release artifacts remain the release output."
          fi

      - name: Checkout
        if: steps.signing.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Java 17
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Decode Admin release keystore
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          echo "$SHOPIVA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shopiva-admin-release.jks"

      - name: Build signed Admin APK and AAB
        if: steps.signing.outputs.configured == 'true'
        env:
          SHOPIVA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shopiva-admin-release.jks
        run: gradle -p delivery-android :app:assembleRelease :app:bundleRelease

      - name: Upload signed Admin APK and AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: shopiva-admin-release-signed
          path: |
            delivery-android/app/build/outputs/apk/release/*.apk
            delivery-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
