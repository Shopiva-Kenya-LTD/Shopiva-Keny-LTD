name: Build Shopiva Admin Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Admin app version, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Require production signing secrets
        env:
          KEYSTORE: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.SHOPIVA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode Admin release keystore
        shell: bash
        env:
          KEYSTORE: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/shopiva-admin-release.jks"

      - name: Build signed Admin APK and AAB
        env:
          SHOPIVA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shopiva-admin-release.jks
          SHOPIVA_ANDROID_STORE_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEYSTORE_PASSWORD }}
          SHOPIVA_ANDROID_KEY_ALIAS: ${{ secrets.SHOPIVA_ANDROID_KEY_ALIAS }}
          SHOPIVA_ANDROID_KEY_PASSWORD: ${{ secrets.SHOPIVA_ANDROID_KEY_PASSWORD }}
        run: gradle -p delivery-android :app:assembleRelease :app:bundleRelease

      - name: Upload signed Admin release privately as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: shopiva-admin-release-${{ inputs.version }}
          retention-days: 30
          path: |
            delivery-android/app/build/outputs/apk/release/*.apk
            delivery-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
