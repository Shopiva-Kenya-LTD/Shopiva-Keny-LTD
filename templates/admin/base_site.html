{% extends "admin/base.html" %}
{% load static %}
{% block branding %}
<a href="{% url 'admin:index' %}" class="shopiva-admin-brand" aria-label="Shopiva Admin Control Center"><span class="shopiva-admin-mark" aria-hidden="true">SA</span><span>Shopi<strong>va</strong><small>ADMIN CONTROL CENTER · KENYA LTD</small></span></a>
{% endblock %}
{% block extrastyle %}{{ block.super }}
<style>
/* SHOPIVA ADMIN VISUAL TAKEOVER — keep Django as the engine, not the UI */
:root{--shopiva-green:#16b66d;--shopiva-green-dark:#078f54;--shopiva-navy:#082334;--shopiva-ink:#10233a;--shopiva-bg:#f4f8fc}
html,body{background:var(--shopiva-bg)!important;color:var(--shopiva-ink)!important}
/* Remove Django's navigation graphics/sidebar everywhere */
#nav-sidebar,
#toggle-nav-sidebar,
#nav-filter,
#nav-filter-clear,
#nav-filter input,
#nav-sidebar + *{ }
#nav-sidebar{display:none!important;visibility:hidden!important;width:0!important;min-width:0!important;max-width:0!important;overflow:hidden!important}
#toggle-nav-sidebar{display:none!important;visibility:hidden!important}
/* Force the content workspace to full width */
#container{width:100%!important;margin:0!important;padding:0!important}
.main{margin-left:0!important}
#content{margin-left:0!important;padding:28px 32px!important;width:auto!important;max-width:none!important}
#content-main{width:100%!important;max-width:none!important;float:none!important}
#content-related{float:none!important;width:100%!important}
/* Remove stock Django breadcrumbs */
#breadcrumbs{display:none!important;height:0!important;overflow:hidden!important}
/* Shopiva-owned header treatment */
#header{background:linear-gradient(135deg,#0b526a,#168c73)!important;color:#fff!important;border:0!important;box-shadow:0 8px 24px rgba(8,35,52,.14)!important;padding:10px 32px!important;min-height:58px!important}
#branding{margin:0!important;padding:0!important}
#branding a,#branding a:link,#branding a:visited{color:#fff!important}
#user-tools{font-size:12px!important;letter-spacing:.02em!important}
#user-tools a{color:#fff!important}
.shopiva-admin-brand{display:inline-flex!important;align-items:center!important;gap:11px!important;text-decoration:none!important;color:#fff!important;font-weight:900!important}
.shopiva-admin-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#16b66d,#078f54);font-size:14px;letter-spacing:-1px;box-shadow:0 7px 18px rgba(0,0,0,.18)}
.shopiva-admin-brand strong{color:#8ff0bc}
.shopiva-admin-brand small{display:block;margin-top:2px;font-size:8px;letter-spacing:1.7px;opacity:.78}
/* Make Django tables/forms feel like Shopiva, not the stock admin */
.module,#changelist-filter,fieldset{border:1px solid #dce8ee!important;border-radius:16px!important;overflow:hidden!important;box-shadow:0 8px 24px rgba(20,55,70,.06)!important;background:#fff!important}
.submit-row{border-radius:14px!important;background:#fff!important;border:1px solid #dce8ee!important}
.button,.submit-row input[type=submit],input[type=submit],.object-tools a{border-radius:10px!important;background:linear-gradient(135deg,var(--shopiva-green),var(--shopiva-green-dark))!important;color:#fff!important;border:0!important}
input,select,textarea{border-radius:10px!important;border-color:#d7e4eb!important}
/* Prevent Django from reappearing after dynamic navigation */

/* Classic Shopiva data-management theme */
#changelist{background:transparent!important}
#changelist .changelist-form{display:block!important}
#changelist .actions{background:#f8fafc!important;border:1px solid #d9e3ea!important;border-radius:14px!important;padding:10px!important;margin:0 0 12px!important}
#changelist .actions select{min-width:210px!important;height:38px!important;background:#fff!important;color:#243447!important}
#changelist .actions .button{height:38px!important;padding:0 15px!important}
#toolbar{background:#fff!important;border:1px solid #d9e3ea!important;border-radius:14px!important;padding:10px!important;margin:0 0 12px!important;box-shadow:0 8px 22px rgba(20,55,70,.05)!important}
#toolbar form{display:flex!important;align-items:center!important;gap:8px!important}
#toolbar input[type=search],#toolbar input[name=q]{height:38px!important;box-sizing:border-box!important;background:#f8fafc!important;color:#172033!important;border:1px solid #cbd8e1!important;border-radius:10px!important;padding:0 12px!important}
#toolbar input[type=submit]{height:38px!important}
#changelist-filter{background:#fff!important;border:1px solid #d9e3ea!important;border-radius:16px!important;box-shadow:0 10px 28px rgba(20,55,70,.07)!important}
#changelist-filter h2{background:linear-gradient(135deg,#31566a,#087f83)!important;color:#fff!important;padding:13px 15px!important;font-size:12px!important;letter-spacing:.08em!important;text-transform:uppercase!important}
#changelist-filter h3{color:#516476!important;font-size:11px!important;padding:12px 15px 5px!important}
#changelist-filter ul{padding:0 15px 9px!important}
#changelist-filter li a{color:#087f83!important;font-weight:700!important}
#changelist-filter li.selected a{color:#0f5e62!important;font-weight:900!important}
#result_list{width:100%!important;border:1px solid #cbd7df!important;border-radius:14px!important;overflow:hidden!important;background:#fff!important;border-collapse:separate!important;border-spacing:0!important;box-shadow:0 14px 34px rgba(20,55,70,.08)!important}
#result_list thead th{background:linear-gradient(180deg,#334155,#263446)!important;color:#f3f7fa!important;border-bottom:2px solid #1e293b!important;padding:13px 12px!important;font-size:10px!important;letter-spacing:.06em!important;text-transform:uppercase!important}
#result_list thead th a{color:#f3f7fa!important}
#result_list tbody td,#result_list tbody th{padding:12px!important;color:#263445!important;border-bottom:1px solid #e1e8ed!important;background:#fff!important;font-size:12px!important}
#result_list tbody tr:nth-child(even) td,#result_list tbody tr:nth-child(even) th{background:#f5f7f9!important}
#result_list tbody tr:hover td,#result_list tbody tr:hover th{background:#e7f4f5!important}
#result_list tbody tr:last-child td,#result_list tbody tr:last-child th{border-bottom:0!important}
#result_list tbody a{color:#087f83!important;font-weight:750!important}
#result_list tbody a:hover{color:#055f62!important}
#result_list .action-checkbox-column{width:38px!important}
#result_list .action-select{accent-color:#087f83!important}
.paginator{margin-top:12px!important;padding:11px 14px!important;background:#fff!important;border:1px solid #d9e3ea!important;border-radius:12px!important;color:#5f7080!important}
.paginator a{color:#087f83!important;font-weight:800!important}
#changelist .object-tools{margin-bottom:12px!important}
#changelist .object-tools a{padding:10px 15px!important;font-size:11px!important;font-weight:900!important;letter-spacing:.02em!important}
#changelist .object-tools a.addlink{background:linear-gradient(135deg,#16b66d,#078f54)!important}
#changelist .object-tools a.addlink:before{content:"＋ ";font-weight:900}
#changelist-search{margin:0!important}
@media(max-width:800px){
  #content{padding:18px 14px!important}
  #changelist .actions{overflow:auto}
  #result_list{min-width:760px}
  #changelist{overflow-x:auto}
  #changelist-filter{margin-top:12px!important}
}
</style>
{% endblock %}
{% block extrahead %}{{ block.super }}
<script>
(function(){
  function suppressDjangoChrome(){
    ['nav-sidebar','toggle-nav-sidebar','breadcrumbs'].forEach(function(id){
      var el=document.getElementById(id); if(el){el.style.setProperty('display','none','important');}
    });
    var container=document.getElementById('container');
    if(container){container.style.setProperty('width','100%','important');container.style.setProperty('margin','0','important');}
    var main=document.querySelector('.main');
    if(main){main.style.setProperty('margin-left','0','important');}
    var content=document.getElementById('content');
    if(content){content.style.setProperty('margin-left','0','important');}
  }
  document.addEventListener('DOMContentLoaded',suppressDjangoChrome);
  window.addEventListener('load',suppressDjangoChrome);
  new MutationObserver(suppressDjangoChrome).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
{% endblock %}
